name: Daily TV Guide

# Runs every day at 4:00 AM IST (22:30 UTC the previous day).
# IST is UTC+5:30, so 04:00 IST == 22:30 UTC.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  build-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-save --no-package-lock

      - name: Generate M3U + EPG
        run: node scripts/generate.js

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add channels.m3u output/epg.xml

          # Only commit when there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily TV guide (M3U + EPG) [skip ci]"
            git push
          fi