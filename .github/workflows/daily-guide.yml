name: Daily TV Guide

# Runs four times per day at 00:00, 06:00, 12:00, and 18:00 UTC
# (05:30, 11:30, 17:30, and 23:30 IST). The EPG window is wide enough
# to bridge a single missed run without leaving the guide stale.
#
# The pipeline can also be triggered manually from the Actions tab via
# "Run workflow". Available inputs:
#   - verify : Probe each stream URL and drop dead ones (default: true)
#
# Output: publishes channels.m3u + epg.xml to GitHub Pages instead of
# committing them to the repository. The repo's Pages URL is the
# `github-pages` environment URL shown after a successful deploy.
on:
  schedule:
    - cron: '0 0/6 * * *'
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify each stream URL before including it'
        type: boolean
        required: false
        default: true

# Required for GitHub Pages deployment via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy runs at a time so a slow generate doesn't get
# overwritten by a newer one mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate M3U + EPG
        env:
          # Allow tuning from the workflow inputs (or env in the Actions UI).
          VERIFY_TIMEOUT_MS: ${{ vars.VERIFY_TIMEOUT_MS || '6000' }}
          VERIFY_CONCURRENCY: ${{ vars.VERIFY_CONCURRENCY || '8' }}
          # BASE_URL is interpolated into the generated M3U's `url-tvg`
          # header so players know where to fetch the matching EPG from.
          # Override via repo variable `vars.PAGES_BASE_URL` if your
          # Pages URL differs from the default.
          BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://node-bug.github.io/ch/' }}
        run: |
          ARGS=""
          if [ "${{ inputs.verify }}" = "true" ]; then ARGS="$ARGS --verify"; fi
          echo "Running: node scripts/fetch-iptvcat-india.js $ARGS"
          node scripts/fetch-iptvcat-india.js $ARGS

      - name: Stage Pages artifact
        # Copy only the two deliverables into a clean directory so we
        # don't ship node_modules / package.json to the Pages site.
        run: |
          mkdir -p _pages
          cp channels.m3u epg.xml _pages/
          ls -la _pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy:
    needs: build-guide
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
