name: Daily TV Guide

# Runs every day at 4:00 AM IST (22:30 UTC the previous day).
# IST is UTC+5:30, so 04:00 IST == 22:30 UTC.
#
# The pipeline can also be triggered manually from the Actions tab via
# "Run workflow". Available inputs:
#   - verify    : Probe each stream URL and drop dead ones (default: true)
#   - commit    : Commit & push the regenerated files (default: true)
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      verify:
        description: 'Verify each stream URL before including it'
        type: boolean
        required: false
        default: true
      commit:
        description: 'Commit and push regenerated channels.m3u + epg.xml'
        type: boolean
        required: false
        default: true

jobs:
  build-guide:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate M3U + EPG
        env:
          # Allow tuning from the workflow inputs (or env in the Actions UI).
          VERIFY_TIMEOUT_MS: ${{ vars.VERIFY_TIMEOUT_MS || '6000' }}
          VERIFY_CONCURRENCY: ${{ vars.VERIFY_CONCURRENCY || '8' }}
        run: |
          ARGS=""
          if [ "${{ inputs.verify }}" = "true" ]; then ARGS="$ARGS --verify"; fi
          echo "Running: node scripts/generate.js $ARGS"
          node scripts/generate.js $ARGS

      - name: Commit and push generated files
        if: ${{ inputs.commit == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add channels.m3u epg.xml

          # Only commit when there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily TV guide (M3U + EPG) [skip ci]"
            git push
          fi